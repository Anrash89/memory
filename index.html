<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magic Memory</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" src="script.js"></script>
</head>
<body>

    <div id="loader" class="screen loader-screen">
        <div class="loader-content">
            <div class="magic-spinner">✨</div>
            <h2>Заряжаем магию...</h2>
            <p>Подготовка карт</p>
        </div>
    </div>

    <div class="app-container">
        
        <div id="menu-screen" class="screen">
            <div class="logo-area">
                <h1>🎩 Magic<br>Memory</h1>
                <p>Тренируй внимание!</p>
            </div>
            <div class="menu-buttons">
                <button id="btn-play" class="main-btn play-btn">ИГРАТЬ ✨</button>
                <button id="btn-leaders" class="main-btn leaders-btn">🏆 РЕКОРДЫ</button>
            </div>
        </div>

        <div id="game-screen" class="screen hidden">
            <header class="game-header">
                <button id="btn-back-menu" class="small-btn">🏠</button>
                <div class="stat">⏳ <span id="time">0с</span></div>
                <div class="stat">⭐️ <span id="score">0</span></div>
            </header>

            <div class="game-board" id="board"></div>
        </div>

        <div id="leaderboard-screen" class="screen hidden">
            <div class="screen-header">
                <h2>🏆 Топ Магов</h2>
                <button id="btn-back-from-leaders" class="small-btn">⬅️ Назад</button>
            </div>
            <div class="leaderboard-container">
                <ul id="leaderboard-list">
                    <li class="loading">Загрузка...</li>
                </ul>
            </div>
        </div>

        <div id="modal" class="modal hidden">
            <div class="modal-content">
                <h2>🎉 ПОБЕДА!</h2>
                <div class="result-circle">
                    <span id="final-score">0</span>
                </div>
                <p>Время: <span id="final-time">0</span> сек</p>
                <div class="modal-buttons">
                    <button id="btn-restart" class="main-btn play-btn">Ещё раз 🔄</button>
                    <button id="btn-menu-win" class="main-btn leaders-btn">В меню 🏠</button>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
